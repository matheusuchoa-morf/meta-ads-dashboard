name: Hourly Health Cron (09h-22h BRT)

# BRT is UTC-3. Business hours 09h-22h BRT = 12h UTC through 01h UTC (next day).
# Cron range splits em duas partes: 12-23 UTC (mesmo dia) + 0-1 UTC (dia seguinte).
# Runs at minute :05 of each hour to avoid the top-of-the-hour cron flood.
on:
  schedule:
    - cron: '5 0-1,12-23 * * *'
  workflow_dispatch:  # manual trigger from GitHub UI

concurrency:
  group: hourly-cron
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Hit /api/cron
        run: |
          RESP=$(curl -sS -w '\nHTTP_STATUS:%{http_code}' \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ vars.APP_URL }}/api/cron")
          echo "$RESP"
          STATUS=$(echo "$RESP" | tail -n1 | sed 's/HTTP_STATUS://')
          if [ "$STATUS" != "200" ]; then
            echo "::error::Cron returned HTTP $STATUS"
            exit 1
          fi
